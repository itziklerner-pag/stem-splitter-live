<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" role="img" aria-label="Stem Splitter Live">
  <title>Stem Splitter Live</title>
  <!-- Chrome Web Store small promo tile. Exactly 440x280, no transparency. -->
  <rect width="440" height="280" fill="#0f1115"/>
  <g opacity="0.13">
    <rect x="300" y="70"  width="20" height="210" rx="10" fill="#ffd166"/>
    <rect x="330" y="30"  width="20" height="250" rx="10" fill="#ff8a82"/>
    <rect x="360" y="95"  width="20" height="185" rx="10" fill="#a89bff"/>
    <rect x="390" y="14"  width="20" height="266" rx="10" fill="#4ce3bb"/>
    <rect x="420" y="86"  width="20" height="194" rx="10" fill="#a9ec74"/>
  </g>
  <g transform="translate(32,34) scale(0.5)">
    <rect width="128" height="128" rx="28" fill="#1a1d23"/>
    <rect x="13"  y="42" width="12" height="44" rx="6" fill="#ffd166"/>
    <rect x="31"  y="28" width="12" height="72" rx="6" fill="#ff8a82"/>
    <rect x="49"  y="36" width="12" height="56" rx="6" fill="#a89bff"/>
    <rect x="67"  y="20" width="12" height="88" rx="6" fill="#4ce3bb"/>
    <rect x="85"  y="34" width="12" height="60" rx="6" fill="#a9ec74"/>
    <rect x="103" y="46" width="12" height="36" rx="6" fill="#ff96e2"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="32" y="150" font-size="34" font-weight="700" letter-spacing="-1" fill="#f5f7fa">Stem Splitter Live</text>
    <text x="32" y="190" font-size="19" font-weight="500" fill="#b3bcc8">Six stems from any YouTube</text>
    <text x="32" y="215" font-size="19" font-weight="500" fill="#b3bcc8">video, live and on-device.</text>
    <text x="32" y="252" font-size="15" font-weight="600" fill="#4ce3bb">No upload · No download</text>
  </g>
</svg>
