      <stop offset="0" stop-color="#14161a"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="560" fill="url(#mg)"/>
  <g opacity="0.15">
    <rect x="880"  y="130" width="52" height="430" rx="26" fill="#ffd166"/>
    <rect x="962"  y="50"  width="52" height="510" rx="26" fill="#ff8a82"/>
    <rect x="1044" y="175" width="52" height="385" rx="26" fill="#a89bff"/>
    <rect x="1126" y="24"  width="52" height="536" rx="26" fill="#4ce3bb"/>
    <rect x="1208" y="158" width="52" height="402" rx="26" fill="#a9ec74"/>
    <rect x="1290" y="232" width="52" height="328" rx="26" fill="#ff96e2"/>
  </g>
  <g transform="translate(88,72) scale(0.78)">
    <rect width="128" height="128" rx="28" fill="#1a1d23"/>
    <rect x="13"  y="42" width="12" height="44" rx="6" fill="#ffd166"/>
    <rect x="31"  y="28" width="12" height="72" rx="6" fill="#ff8a82"/>
