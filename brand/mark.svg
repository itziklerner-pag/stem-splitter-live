<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Stem Splitter Live">
  <title>Stem Splitter Live</title>
  <!--
    Six bars, one per stem, in the deck's own display order and the deck's own
    colours (tokens.css --color-stem-*). Vertically centred rather than sitting
    on a baseline, so it reads as a waveform as well as a set of faders.

    Bar geometry is 12 wide on an 18 pitch: 6*12 + 5*6 = 102, centred in 128
    leaves 13 either side.

    THIS MARK IS FOR 48 px AND UP. At 16 px a 12-wide bar is 1.5 px with a
    0.75 px gap, so the six bars blur into one coloured block — checked by
    rendering it. mark-small.svg is the three-bar cut used for 16 and 32.
  -->
  <rect width="128" height="128" rx="28" fill="#0f1115"/>
  <g>
    <rect x="13"  y="42" width="12" height="44" rx="6" fill="#ffd166"/><!-- vocals -->
    <rect x="31"  y="28" width="12" height="72" rx="6" fill="#ff8a82"/><!-- drums  -->
    <rect x="49"  y="36" width="12" height="56" rx="6" fill="#a89bff"/><!-- bass   -->
    <rect x="67"  y="20" width="12" height="88" rx="6" fill="#4ce3bb"/><!-- other  -->
    <rect x="85"  y="34" width="12" height="60" rx="6" fill="#a9ec74"/><!-- guitar -->
    <rect x="103" y="46" width="12" height="36" rx="6" fill="#ff96e2"/><!-- piano  -->
  </g>
</svg>
